<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAN scanner</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bench: #eef1f5; --card: #fff; --ink: #14171f; --steel: #5f6b7e; --line: #d5dbe5; --laser: #e4002b;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bench); color: var(--ink); font: 400 1rem/1.5 Barlow, system-ui, sans-serif; }
  :focus-visible { outline: 2px solid var(--laser); outline-offset: 2px; }

  /* minmax(0, ...): a plain 1fr track refuses to go narrower than the EAN input, which pushed the page off 360px phones */
  .bench { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
  .bench > header h1 { margin: 0; font: 700 2.5rem/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
  .bench > header p { margin: .25rem 0 0; color: var(--steel); }
  @media (min-width: 52rem) {
    .bench { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto auto 1fr; align-items: start;
      grid-template-areas: "head head" "cam result" "other result"; }
    .bench > header { grid-area: head; }
    .cam { grid-area: cam; }
    .result { grid-area: result; }
    .other { grid-area: other; }
  }

  /* scanner */
  .viewfinder { position: relative; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 12px; background: var(--ink); }
  .viewfinder video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .viewfinder::before { /* corner brackets */
    content: ""; position: absolute; inset: 16% 10%; z-index: 1; pointer-events: none;
    --c: linear-gradient(rgba(255,255,255,.8), rgba(255,255,255,.8));
    background: var(--c) top left / 28px 2px, var(--c) top left / 2px 28px,
      var(--c) top right / 28px 2px, var(--c) top right / 2px 28px,
      var(--c) bottom left / 28px 2px, var(--c) bottom left / 2px 28px,
      var(--c) bottom right / 28px 2px, var(--c) bottom right / 2px 28px;
    background-repeat: no-repeat;
  }
  .laser { position: absolute; left: 10%; right: 10%; top: 50%; z-index: 1; height: 2px; opacity: .45;
    background: var(--laser); box-shadow: 0 0 12px 2px rgba(228, 0, 43, .7); }
  .viewfinder.on .laser { opacity: 1; animation: sweep 2.2s ease-in-out infinite alternate; }
  @keyframes sweep { from { top: 22%; } to { top: 78%; } }
  @media (prefers-reduced-motion: reduce) { .viewfinder.on .laser { animation: none; } }

  button { font: 500 1rem/1 Barlow, system-ui, sans-serif; border: 0; border-radius: 8px; padding: .85rem 1.1rem;
    color: #fff; background: var(--ink); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #camera { position: absolute; z-index: 2; left: 50%; bottom: 1rem; transform: translateX(-50%); background: var(--laser); white-space: nowrap; }
  .note { margin: .5rem 0 0; color: var(--steel); }
  .note.error { color: var(--laser); }
  .note:empty { display: none; }
  #photo { position: absolute; opacity: 0; pointer-events: none; }
  .photo { display: block; padding: .85rem 1.1rem; border: 1.5px solid var(--line); border-radius: 8px;
    font-weight: 500; line-height: 1; text-align: center; background: var(--card); cursor: pointer; }
  #photo:focus-visible + .photo { outline: 2px solid var(--laser); outline-offset: 2px; }

  #manual { margin-top: 1.25rem; }
  #manual label { display: block; margin-bottom: .35rem; font-weight: 500; font-size: .875rem; color: var(--steel); }
  #manual .row { display: flex; gap: .5rem; }
  #ean { flex: 1; min-width: 0; font: 400 1.125rem/1 var(--mono); padding: .75rem; color: var(--ink);
    background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; }

  /* result */
  .empty, .missing, #found { margin: 0; border-radius: 12px; }
  .empty { padding: 2rem 1.25rem; border: 1.5px dashed var(--line); color: var(--steel); }
  .missing { padding: 1.25rem; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--laser); }
  #found { overflow: hidden; background: var(--card); border: 1px solid var(--line); }
  .swatch { height: 5rem; border-bottom: 1px solid var(--line);
    background: repeating-linear-gradient(45deg, var(--line) 0 6px, transparent 6px 12px); /* colour unknown */ }
  .detail { padding: 1rem 1.25rem 1.25rem; }
  .eyebrow, dt { font: 400 .75rem/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--steel); }
  .eyebrow { margin: 0; }
  .colour { margin: .25rem 0 1rem; font: 700 clamp(2.5rem, 9vw, 4rem)/.95 var(--display); text-transform: uppercase; }
  figure { margin: 0; }
  #image { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 8px; background: var(--bench); }
  figcaption { padding: 1rem; border-radius: 8px; background: var(--bench); color: var(--steel); }
  #name { margin: 1rem 0; font: 500 1.0625rem/1.4 Barlow, system-ui, sans-serif; }
  dl { display: flex; flex-wrap: wrap; gap: 1rem 2rem; margin: 0; }
  dd { margin: .35rem 0 0; font: 500 1rem/1 var(--mono); }
</style>
</head>
<body>
<main class="bench">
  <header>
    <h1>EAN scanner</h1>
    <p>Scan a barcode to check the product and its colour.</p>
  </header>

  <section class="cam" aria-label="Scan a barcode">
    <div class="viewfinder" id="viewfinder">
      <video id="video" playsinline muted autoplay></video>
      <span class="laser"></span>
      <button id="camera" type="button">Start camera</button>
    </div>
    <p id="camera-note" class="note" role="status"></p>
  </section>

  <section class="result" id="result" aria-label="Scanned product" aria-live="polite">
    <p id="empty" class="empty">Nothing scanned yet. Point the camera at a barcode, or type the EAN.</p>
    <p id="missing" class="missing" hidden></p>
    <article id="found" hidden>
      <div class="swatch" id="swatch"></div>
      <div class="detail">
        <p class="eyebrow">Colour</p>
        <p class="colour" id="colour"></p>
        <figure>
          <img id="image" alt="" referrerpolicy="no-referrer">
          <figcaption id="image-note" hidden>Image didn't load. Check the Drive file is shared with "Anyone with the link".</figcaption>
        </figure>
        <h2 id="name"></h2>
        <dl>
          <div><dt>EAN</dt><dd id="code"></dd></div>
          <div><dt>SKU</dt><dd id="sku"></dd></div>
        </dl>
      </div>
    </article>
  </section>

  <section class="other" aria-label="Other ways to find a product">
    <input id="photo" type="file" accept="image/*" capture="environment">
    <label class="photo" for="photo">Scan from a photo</label>
    <form id="manual">
      <label for="ean">Or type the EAN (a USB scanner works here too)</label>
      <div class="row">
        <input id="ean" inputmode="numeric" autocomplete="off" placeholder="8906209350897">
        <button>Find product</button>
      </div>
    </form>
  </section>
</main>

<script src="products.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const key = code => code.replace(/\D/g, '').replace(/^0+/, ''); // same normalisation as build.py
  let stream = null, last = '';

  function show(code) {
    last = code;
    const p = PRODUCTS[key(code)];
    $('empty').hidden = true;
    $('found').hidden = !p;
    $('missing').hidden = !!p;
    if (!p) {
      $('missing').textContent = `No product with EAN ${code}. Check the code, or add it to products.xlsx and run build.py.`;
      return;
    }
    $('swatch').style.background = p.hex;
    $('colour').textContent = p.colour || 'Not listed';
    $('image-note').hidden = true;
    $('image').hidden = false;
    $('image').src = p.image;
    $('image').alt = p.name;
    $('name').textContent = p.name;
    $('code').textContent = code;
    $('sku').textContent = p.sku;
    navigator.vibrate?.(80);
    $('result').scrollIntoView({ block: 'nearest' });
  }

  $('image').onerror = () => { $('image').hidden = true; $('image-note').hidden = false; };

  $('manual').onsubmit = e => {
    e.preventDefault();
    if (key($('ean').value)) show($('ean').value.trim());
    $('ean').select(); // next scan from a USB scanner overwrites this one
  };

  function note(text, error = false) {
    $('camera-note').textContent = text;
    $('camera-note').classList.toggle('error', error);
  }

  // The number on a label is an EAN, but label printers usually draw it as Code 128, not EAN-13 bars.
  // So read every common symbology and match on the digits.
  const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'qr_code'];
  const ZBAR_TYPES = /EAN|UPC|CODE128|CODE39|CODE93|QRCODE/;

  // zbar.js is @undecaf/zbar-wasm 0.11.0 (LGPL-2.1), kept in this repo so scanning never depends on a CDN being reachable.
  // Loaded in the background: the buttons must work the instant the page shows, not after 330 KB arrives.
  const zbarLoaded = new Promise((ok, fail) => {
    const script = document.createElement('script');
    script.src = 'zbar.js';
    script.onload = ok;
    script.onerror = () => fail(new Error('the barcode reader (zbar.js) did not load, check the connection and reload'));
    document.head.append(script);
  });
  zbarLoaded.catch(() => {}); // reported where it is awaited; this just keeps the console quiet when the native detector never needs it

  // Resolves to detect(videoOrBitmap) -> array of decoded strings.
  // ZBar rather than ZXing: on webcam-grade frames (blur, noise, tilt) it read twice as many codes in our benchmark.
  const detectReady = (async () => {
    // Chrome on Windows/Linux exposes BarcodeDetector but supports no formats, so ask before trusting it.
    // On Android this call goes out to a system service that can hang, so it gets 2 seconds.
    const supported = 'BarcodeDetector' in window
      ? await Promise.race([BarcodeDetector.getSupportedFormats(), new Promise(ok => setTimeout(ok, 2000, []))]).catch(() => [])
      : [];
    const formats = FORMATS.filter(f => supported.includes(f));
    const native = formats.includes('ean_13') ? new BarcodeDetector({ formats }) : null;
    const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
    return async source => {
      // Native first: fast on Android/macOS. It comes back empty when the OS barcode module is missing, so ZBar backs it up.
      const quick = native ? (await native.detect(source).catch(() => [])).map(b => b.rawValue) : [];
      if (quick.length) return quick;
      await zbarLoaded;
      const w = source.videoWidth || source.width, h = source.videoHeight || source.height;
      const k = Math.min(1, 2560 / Math.max(w, h)); // ponytail: big photos are shrunk to 2560px to bound memory; tile them if tiny barcodes in huge photos matter
      canvas.width = w * k;
      canvas.height = h * k;
      ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
      const symbols = await zbarWasm.scanImageData(ctx.getImageData(0, 0, canvas.width, canvas.height));
      return symbols.filter(s => ZBAR_TYPES.test(s.typeName)).map(s => s.decode());
    };
  })();

  // Several codes in view (label sheets, batch codes): take the one that is a known product.
  const pick = codes => codes.find(c => PRODUCTS[key(c)]) ?? codes[0];

  const CAMERA_HELP = {
    NotAllowedError: 'Camera permission is blocked. Tap the icon at the left of the address bar, allow Camera, then reload the page.',
    NotFoundError: 'No camera was found on this device.',
    NotReadableError: 'The camera is busy. Close other tabs or apps that are using it, then try again.',
  };

  // Full HD first (small barcodes need the pixels), then plainer requests for cameras that refuse it.
  const CAMERA_TRIES = [{ facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, { facingMode: 'environment' }, true];

  async function openCamera() {
    if (!navigator.mediaDevices) throw new Error('this page must be opened over HTTPS or localhost');
    let error;
    for (const video of CAMERA_TRIES) {
      try { return await navigator.mediaDevices.getUserMedia({ video }); }
      catch (e) { error = e; if (e.name === 'NotAllowedError') break; } // asking again will not change a "no"
    }
    throw error;
  }

  async function startCamera() {
    $('camera').disabled = true;
    note('Starting camera…');
    const slow = setTimeout(() => note('Still waiting for the camera. If the browser is asking for permission, tap Allow.'), 6000);
    try {
      stream = await openCamera();
      $('video').srcObject = stream;
      // a blocked preview is not a blocked camera, so give it its own words rather than the permission advice
      await $('video').play().catch(e => { throw new Error(`the video preview was blocked (${e.name})`); });
    } catch (e) {
      if (stream) stopCamera();
      note(`${CAMERA_HELP[e.name] ?? 'The camera did not start.'} You can still scan from a photo or type the EAN. (${e.name}: ${e.message})`, true);
      return;
    } finally {
      clearTimeout(slow);
      $('camera').disabled = false;
    }
    const mine = stream;
    $('viewfinder').classList.add('on');
    $('camera').textContent = 'Stop camera';
    note('Scanning. Hold the barcode steady inside the frame. Not reading? Move it further away until it looks sharp.');
    const detect = await detectReady; // after the camera is up, so a slow detector never holds the camera back
    let fails = 0, seen;
    (async function tick() {
      if (stream !== mine) return;
      try {
        const code = pick(await detect($('video')));
        fails = 0;
        if (code && code === seen && code !== last) show(code); // two frames must agree, a lone read can be a misread
        seen = code;
      } catch (e) {
        if (++fails > 10) { // one-off errors happen while the video warms up; a streak means it's broken
          stopCamera();
          note(`Scanner stopped: ${e.message}. Scan from a photo or type the EAN instead.`, true);
          return;
        }
      }
      setTimeout(tick, 120);
    })();
  }

  $('photo').onchange = async e => {
    const file = e.target.files[0];
    e.target.value = ''; // so picking the same photo again still fires
    if (!file) return;
    try {
      const code = pick(await (await detectReady)(await createImageBitmap(file)));
      if (code) { note(''); show(code); }
      else {
        $('found').hidden = $('missing').hidden = true; // don't leave the previous product up as if it matched
        $('empty').hidden = false;
        last = '';
        note('No barcode found in that photo. Get closer, so the barcode fills most of the picture.', true);
      }
    } catch (err) {
      note(`Could not read that photo: ${err.message}`, true);
    }
  };

  function stopCamera() {
    stream.getTracks().forEach(t => t.stop());
    stream = $('video').srcObject = null;
    $('viewfinder').classList.remove('on');
    $('camera').textContent = 'Start camera';
    note('');
  }

  $('camera').onclick = () => stream ? stopCamera() : startCamera();

  // Desktop only: a USB scanner types into whatever has focus. On phones the input sits below the fold.
  if (matchMedia('(min-width: 52rem)').matches) $('ean').focus({ preventScroll: true });
</script>
</body>
</html>
